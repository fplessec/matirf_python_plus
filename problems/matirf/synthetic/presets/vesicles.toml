# Vesicles and endosomes scattered in depth: small, point-like objects whose depth must be
# recovered plane by plane — the basic test of axial localization.
[grid]
nx = 128
ny = 128
nz = 50
z_oversampling = 3
dxy_nm = 100.0
z0_nm = 0.0
zN_nm = 300.0
fine_step_nm = 25.0

[sampling]
seed = 15

[ellipsoid]
count = 150
lateral_size_min_nm = 150.0
lateral_size_max_nm = 500.0
axial_size_min_nm = 80.0
axial_size_max_nm = 200.0
depth_min_nm = 20.0
depth_max_nm = 280.0
max_tilt_deg = 10.0
sharpness = 1.5
amplitude = 1.0

[filament]
count = 0

[membrane]
count = 0
