# =============================================================================
# pyproject.toml - matirf_python_plus
# =============================================================================
# This file turns the project into an installable Python package.
#
# Once installed in editable mode:
#     source env/bin/activate
#     pip install -e .
#
# You can import your modules from anywhere in the venv:
#     from common.algorithms import BaseAdam
#     from common.denoisers import DENOISER_REGISTRY
#     ...
#
# Console entry points:
#     matirf gui                  # launch matirf GUI
#     matirf cli -c config.toml   # launch matirf CLI
#     matirf reset                # delete the cached config.toml
#     deconv gui                  # launch deconv GUI
#     deconv reset                # delete the cached config.toml
#     inverse-problems list       # list available inverse problems
# =============================================================================


# -----------------------------------------------------------------------------
# Build system: tells pip how to build the package.
# setuptools is the standard tool, works everywhere.
# -----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


# -----------------------------------------------------------------------------
# Project metadata (PEP 621)
# -----------------------------------------------------------------------------
[project]
name = "matirf_python_plus"
version = "0.1.0"
description = "Generic inverse problem solver with MA-TIRF and deconvolution implementations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ferdinand Plesse--Costa", email = "ferdinand.plesse--costa@hotmail.fr" },
]

# -----------------------------------------------------------------------------
# Runtime dependencies - strict minimum required for the project to work.
# Each line corresponds to a module actually imported in the code.
# -----------------------------------------------------------------------------
dependencies = [
    "torch>=2.7.1",            # tensors, CPU/GPU computations (used everywhere)
    "numpy>=2.0",              # nlridge.py, abstract_algo.py, viewers, etc.
    "matplotlib>=3.10.3",      # GUI viewers, qlatexlabel
    "PyQt5>=5.15.11",          # graphical interface
    "tifffile>=2025.5.10",     # in_out/tif_file.py
    "tomli>=2.2.1",            # in_out/toml_file.py (reading)
    "tomli_w>=1.2.0",          # in_out/toml_file.py + display_window.py (writing)
    "Pillow>=10.0",            # algorithms/denoisers/tests/__init__.py + denoise_tv_bregman.py
    "scikit-image>=0.22",      # reconstruction_metrics (SSIM), pnp_algo, nlridge, denoise_tv_bregman (estimate_sigma)
    "einops>=0.7",             # algorithms/denoisers/nlridge.py (rearrange, repeat)
]


# -----------------------------------------------------------------------------
# Optional dependencies (dev, tests, ...)
# Install with: pip install -e ".[dev]"
# -----------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]


# -----------------------------------------------------------------------------
# Console entry points
#
# Each inverse problem has its own command that delegates to cli.py.
# cli.py detects the problem from the command name (sys.argv[0]).
# "inverse-problems" is a utility command to list available problems.
#
# To add a new inverse problem (e.g. superres):
#   1. Create the superres/ package with main.py and cache/
#   2. Add here:  superres = "cli:main"
#   3. pip install -e .
# -----------------------------------------------------------------------------
[project.scripts]
matirf = "cli:main"
deconv = "cli:main"
list = "cli:main"
help = "cli:main"
settings = "cli:main"


# -----------------------------------------------------------------------------
# Automatic package discovery
# - keep only real packages (directories with __init__.py)
# - exclude env/, data/, __pycache__/
# -----------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = [
    "common*",
    "matirf*",
    "deconv*",
]
exclude = [
    "env*",
    "*.data*",
    "__pycache__*",
]

# -----------------------------------------------------------------------------
# Top-level Python modules to install alongside the packages.
# cli.py is the centralized entry point at the project root.
# -----------------------------------------------------------------------------
[tool.setuptools]
py-modules = ["cli"]
